name: Node.js API

on:
  push:
    paths:
      - "nodejs/**"
      - ".github/workflows/nodejs-api.yml"
  pull_request:
    paths:
      - "nodejs/**"
      - ".github/workflows/nodejs-api.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: nodejs
      - run: npm test
        working-directory: nodejs
