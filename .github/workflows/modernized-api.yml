name: Modernized API

on:
  push:
    paths:
      - "modernized/**"
      - ".github/workflows/modernized-api.yml"
  pull_request:
    paths:
      - "modernized/**"
      - ".github/workflows/modernized-api.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run API tests
        run: mvn -B -f modernized/pom.xml verify
